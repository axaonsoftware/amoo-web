# Production-grade full-stack deployment for Amoo Guru.
#
# Starts PostgreSQL, the Express backend, the Next.js frontend, and an nginx
# reverse proxy on a single host.
#
# Usage:
#   docker compose up -d
#   docker compose logs -f
#
# Required in a .env file beside this one:
#   DB_PASSWORD=...
#   JWT_SECRET=...                        (same as JWT_SECRET below)
#   JWT_REFRESH_SECRET=...
#   CLIENT_ORIGIN=https://your-domain
#   CLIENT_URL=https://your-domain        (public frontend origin, used in email links)
#   APP_URL=https://your-domain           (public API origin, used in Razorpay webhook callbacks)
#   PAYMENT_GATEWAY=razorpay
#   PAYMENT_WEBHOOK_SECRET=...
#   RAZORPAY_KEY_ID=... / RAZORPAY_KEY_SECRET=...
#   EMAIL_ENABLED=true                       (REQUIRED in prod — forgot-password /
#                                              verify-email flows depend on SMTP;
#                                              the backend refuses to boot without it)
#   EMAIL_HOST=... EMAIL_PORT=587 EMAIL_USER=... EMAIL_PASS=...
#   NEXT_PUBLIC_API_URL=https://your-domain   (BARE origin — the app appends /api itself)
#   NEXT_PUBLIC_WHATSAPP_NUMBER=...
#
# HTTPS is mandatory: before the first `up`, place real certificates at
# ./certs/fullchain.pem and ./certs/privkey.pem (e.g. via certbot). nginx
# refuses to start without them. Recommended: APP_URL=https://your-domain
# so Swagger's "try it" base and webhook callbacks use the public origin.
#
# For production deploys via GitHub Actions, set these in the shell or .env
# on the server before running `docker compose pull`:
#   REGISTRY=ghcr.io
#   IMAGE_TAG=latest   (or the git SHA)
#   GITHUB_REPOSITORY=axaonsoftware/amoo-web
#
# See amoo-backend/.env.example for the full list.

services:
  # ── Reverse proxy ──────────────────────────────────────────────────────
  nginx:
    build: ./nginx
    image: ${REGISTRY:-ghcr.io}/${GITHUB_REPOSITORY:-axaonsoftware/amoo-web}/nginx:${IMAGE_TAG:-latest}
    container_name: amoo_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_started
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Mount real certificates for HTTPS in production
      - ./certs:/etc/nginx/certs:ro
    networks:
      - amoo_network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Frontend (Next.js) ─────────────────────────────────────────────────
  frontend:
    build:
      context: ./amoo-web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
        NEXT_PUBLIC_WHATSAPP_NUMBER: ${NEXT_PUBLIC_WHATSAPP_NUMBER:-}
        NEXT_PUBLIC_SITE_NAME: ${NEXT_PUBLIC_SITE_NAME:-Amoo Guru}
        NEXT_PUBLIC_CONTACT_EMAIL: ${NEXT_PUBLIC_CONTACT_EMAIL:-contact@amooguru.com}
    image: ${REGISTRY:-ghcr.io}/${GITHUB_REPOSITORY:-axaonsoftware/amoo-web}/frontend:${IMAGE_TAG:-latest}
    container_name: amoo_frontend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          memory: 512M
    depends_on:
      backend:
        condition: service_started
    environment:
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
    networks:
      - amoo_network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── Backend (Express API) ──────────────────────────────────────────────
  backend:
    build: ./amoo-backend
    image: ${REGISTRY:-ghcr.io}/${GITHUB_REPOSITORY:-axaonsoftware/amoo-web}/backend:${IMAGE_TAG:-latest}
    container_name: amoo_backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          memory: 512M
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_NAME: ${DB_NAME:-amoo_db}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:?CLIENT_ORIGIN is required}
      CLIENT_URL: ${CLIENT_URL:?CLIENT_URL is required}
      APP_URL: ${APP_URL:?APP_URL is required (public API origin, used in Razorpay webhook callbacks)}
      PAYMENT_GATEWAY: ${PAYMENT_GATEWAY:?PAYMENT_GATEWAY is required}
      PAYMENT_KEY: ${PAYMENT_KEY:-}
      PAYMENT_SECRET: ${PAYMENT_SECRET:-}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:?PAYMENT_WEBHOOK_SECRET is required}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASS: ${EMAIL_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-no-reply@amooguru.com}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      S3_ENABLED: ${S3_ENABLED:-false}
    volumes:
      - amoo_uploads:/app/uploads
    networks:
      - amoo_network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:4000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── Database (PostgreSQL) ──────────────────────────────────────────────
  db:
    image: postgres:16
    container_name: amoo_db
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G
        reservations:
          memory: 1G
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:-amoo_db}
    volumes:
      - amoo_db_data:/var/lib/postgresql/data
    networks:
      - amoo_network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Daily database backup ────────────────────────────────────────────────
  # pg_dump to a named volume once a day, keeping the last 14 dumps. Restore
  # procedure:  pg_restore -h db -U postgres -d amoo_db <backup_file>.dump
  db-backup:
    image: postgres:16-alpine
    container_name: amoo_db_backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_NAME: ${DB_NAME:-amoo_db}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
    volumes:
      - amoo_db_backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        while true; do
          FILE="/backups/amoo_$$(date +%Y%m%d_%H%M%S).dump";
          PGPASSWORD="$$DB_PASSWORD" pg_dump -h "$$DB_HOST" -U "$$DB_USER" -d "$$DB_NAME" -Fc > "$$FILE" && echo "backup written: $$FILE" || echo "backup FAILED";
          ls -1t /backups/amoo_*.dump 2>/dev/null | tail -n +$$((BACKUP_KEEP + 1)) | xargs -r rm -f;
          sleep 86400;
        done
    networks:
      - amoo_network

networks:
  amoo_network:
    driver: bridge

volumes:
  amoo_db_data:
  amoo_uploads:
  amoo_db_backups: