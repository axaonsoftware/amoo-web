[backend]
  serviceName = "amoo-backend"
  dockerfilePath = "amoo-backend/Dockerfile"

[backend.healthcheck]
  path = "/api/health"

[frontend]
  serviceName = "amoo-web"
  dockerfilePath = "amoo-web/Dockerfile"

[frontend.build]
  buildArgs = { NEXT_PUBLIC_API_URL = "https://amoo-guru.railway.app/api", NEXT_PUBLIC_SITE_NAME = "Amoo Guru" }
