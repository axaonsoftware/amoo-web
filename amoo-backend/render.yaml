# Render.com blueprint.
# Create a "Blueprint" and connect this repo; Render will provision both
# the web service and the MySQL instance, then run migrate + start.

services:
  - type: web
    name: amoo-backend
    runtime: node
    plan: starter
    region: oregon
    branch: main
    rootDir: amoo-backend
    buildCommand: npm install
    startCommand: sh -c "node src/migrate.js && node src/server.js"
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DB_HOST
        fromDatabase:
          name: amoo-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: amoo-db
          property: port
      - key: DB_USER
        fromDatabase:
          name: amoo-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: amoo-db
          property: password
      - key: DB_NAME
        fromDatabase:
          name: amoo-db
          property: database
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        value: https://your-frontend-domain.com
      - key: APP_URL
        value: https://amoo-backend.onrender.com

databases:
  - name: amoo-db
    databaseName: amoo_db
    plan: starter
    region: oregon
