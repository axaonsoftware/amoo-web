# Railway deployment config (root of repo; backend lives in ./amoo-backend).
# Link this repo to Railway and add a MySQL plugin. Set the env vars below
# (Railway auto-injects MYSQL_*; map them in the service variables).

{
  "$schema": "https://railway.app/railway.schema.json",
  "build": {
    "builder": "npm",
    "rootDirectory": "amoo-backend",
    "watchPatterns": ["amoo-backend/**"]
  },
  "deploy": {
    "rootDirectory": "amoo-backend",
    "startCommand": "sh -c \"node src/migrate.js && node src/server.js\"",
    "healthcheckPath": "/api/health",
    "healthcheckTimeout": 100,
    "restartPolicyType": "on_failure",
    "restartPolicyMaxRetries": 10
  },
  "environments": {
    "production": {
      "NODE_ENV": "production",
      "PORT": "4000",
      "CLIENT_ORIGIN": "https://your-frontend-domain.com",
      "JWT_SECRET": "{{RAILWAY_INITIAL_GENERATED_VALUE}}",
      "JWT_REFRESH_SECRET": "{{RAILWAY_INITIAL_GENERATED_VALUE}}"
    }
  }
}
