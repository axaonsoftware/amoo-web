name: Deploy

# Deployment only runs AFTER the CI workflow has finished successfully on the
# branch head. A red CI can never ship: the `deploy` job aborts unless the
# triggering workflow_run concluded with `success`. Manual dispatch
# (workflow_dispatch) bypasses the gate for emergency deploys.
on:
  workflow_run:
    workflows: ["CI"]
    branches: [main, master]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # Use the commit that CI ran on (workflow_run) or the manual-dispatch head.
  IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  build-and-push:
    name: Build & push Docker images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # The workflow_run event carries the branch name and SHA for us, but
      # actions/checkout needs them passed explicitly.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: amoo-backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/backend:${{ env.IMAGE_TAG }},${{ env.REGISTRY }}/${{ github.repository }}/backend:latest

      - name: Validate frontend build args
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || secrets.NEXT_PUBLIC_API_URL || '' }}
        run: |
          case "$NEXT_PUBLIC_API_URL" in
            '')
              echo "::error::NEXT_PUBLIC_API_URL is not set. Set it (repo variable/secret) to https://your-domain (no /api)."
              exit 1
              ;;
            http://localhost*|http://127.0.0.1*)
              echo "::error::NEXT_PUBLIC_API_URL must be the public origin, not '$NEXT_PUBLIC_API_URL'."
              exit 1
              ;;
            */api|*/api/)
              echo "::error::NEXT_PUBLIC_API_URL must NOT end in /api — the app appends /api itself. Got '$NEXT_PUBLIC_API_URL'."
              exit 1
              ;;
            *)
              echo "NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL"
              ;;
          esac

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: amoo-web
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/frontend:${{ env.IMAGE_TAG }},${{ env.REGISTRY }}/${{ github.repository }}/frontend:latest
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || secrets.NEXT_PUBLIC_API_URL || 'http://localhost:4000' }}
            NEXT_PUBLIC_WHATSAPP_NUMBER=${{ vars.NEXT_PUBLIC_WHATSAPP_NUMBER || secrets.NEXT_PUBLIC_WHATSAPP_NUMBER || '' }}
            NEXT_PUBLIC_SITE_NAME=${{ vars.NEXT_PUBLIC_SITE_NAME || 'Amoo Guru' }}
            NEXT_PUBLIC_CONTACT_EMAIL=${{ vars.NEXT_PUBLIC_CONTACT_EMAIL || secrets.NEXT_PUBLIC_CONTACT_EMAIL || 'contact@amooguru.com' }}

      - name: Build & push nginx
        uses: docker/build-push-action@v5
        with:
          context: nginx
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/nginx:${{ env.IMAGE_TAG }},${{ env.REGISTRY }}/${{ github.repository }}/nginx:latest

  deploy:
    name: Deploy to server
    needs: build-and-push
    runs-on: ubuntu-latest
    # Only deploy from the branch CI just ran on, and only when CI succeeded.
    # Manual workflow_dispatch has no workflow_run event -> gate is skipped.
    if: (github.event.workflow_run == null || github.event.workflow_run.conclusion == 'success')
    permissions:
      contents: read
      packages: read

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: REGISTRY,IMAGE_TAG,GITHUB_REPOSITORY
          script: |
            # Log in to GHCR so `docker compose pull` can fetch private images.
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
            cd /opt/amoo-web
            export REGISTRY=${{ env.REGISTRY }}
            export IMAGE_TAG=${{ env.IMAGE_TAG }}
            export GITHUB_REPOSITORY=${{ github.repository }}
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f

      - name: Verify services are healthy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/amoo-web
            echo "Waiting for services to become healthy..."
            UNHEALTHY=""
            for i in $(seq 1 40); do
              UNHEALTHY=$(docker compose ps --format json 2>/dev/null | grep -c '"Healthy":false' || true)
              RUNNING=$(docker compose ps --format json 2>/dev/null | grep -c '"State":"running"' || true)
              if [ "$UNHEALTHY" = "0" ] && [ "$RUNNING" -ge 3 ]; then
                echo "All services are healthy."
                docker compose ps
                exit 0
              fi
              echo "  attempt $i/40 — waiting 5s... (unhealthy: $UNHEALTHY, running: $RUNNING)"
              sleep 5
            done
            echo "ERROR: Services did not become healthy within 200 seconds."
            docker compose ps
            docker compose logs --tail=30 backend
            exit 1
