name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# A new push to the same branch cancels the run still in flight for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            ghcr.io/gitleaks/gitleaks:latest detect \
            --source /repo --log-opts="--all" --redact --no-banner

  backend:
    name: amoo-backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: amoo-backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_root_password
          POSTGRES_DB: amoo_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20" # matches amoo-backend/Dockerfile
          cache: npm
          cache-dependency-path: amoo-backend/package-lock.json

      - run: npm ci

      # The backend has no build step; --if-present keeps this honest
      # rather than green-by-accident if one is added later.
      - run: npm run build --if-present

      - run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: ci-access-secret-not-used-outside-ci
          JWT_REFRESH_SECRET: ci-refresh-secret-not-used-outside-ci

      # Catches the class of bug this project shipped twice: a schema that is
      # missing columns the code writes to, so the app only works if you
      # happened to run the migration runner. Applies the migration against a
      # real PostgreSQL, then boots the server for real.
      - name: Verify migrations and boot against PostgreSQL
        run: |
          npm run migrate
          NODE_ENV=test node -e "require('./src/server.js'); console.log('server boots OK')"
        env:
          NODE_ENV: development
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: ci_root_password
          DB_NAME: amoo_ci
          JWT_SECRET: ci-access-secret-not-used-outside-ci
          JWT_REFRESH_SECRET: ci-refresh-secret-not-used-outside-ci

      # Fails on a known CVE in a RUNTIME dependency. Dev-only advisories are
      # excluded so a vulnerability in a test tool cannot block a release —
      # this gates what actually ships in the image.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

  frontend:
    name: amoo-web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: amoo-web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22, not 20: `npm test` runs .ts files through Node's native
          # type-stripping (node --test lib/__tests__/*.test.ts), which needs
          # Node >= 22.6. The build image can stay on 20 — it never runs the
          # tests — but CI must match the runtime the tests need.
          node-version: "22"
          cache: npm
          cache-dependency-path: amoo-web/package-lock.json

      - run: npm ci

      # `next build` type-checks too, but a standalone pass fails faster and
      # reports every error instead of stopping at the first file.
      - name: Type check
        run: npx tsc --noEmit

      # NEW: lint was never run in CI, which is how the frontend accumulated
      # 400+ violations unnoticed.
      - name: Lint
        run: npm run lint

      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
          NEXT_PUBLIC_SITE_NAME: Amoo Guru
          NEXT_PUBLIC_CONTACT_EMAIL: contact@amooguru.com
          NEXT_TELEMETRY_DISABLED: "1"

      - run: npm test

      # Fail on any dependency vulnerability that ships in the bundle.
      # Dev-only advisories (test tools, build tools) are excluded since
      # they do not end up in the production bundle.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      # Bundle size guard — fails the build if the total JS payload
      # exceeds the threshold in bytes. Catches accidental import bloat
      # before it ships to users. The threshold is deliberately above the
      # current ~2.5MB so normal churn never trips it, but a runaway
      # dependency (adding multiple MB) will.
      - name: Check bundle size
        run: |
          MAX_SIZE=2000000
          STATS=$(find .next/static -name '*.js' 2>/dev/null | xargs -I{} wc -c {} 2>/dev/null | awk '{total += $1} END {print total}')
          echo "Total JS bundle size: $STATS bytes (limit: $MAX_SIZE)"
          if [ "$STATS" -gt "$MAX_SIZE" ]; then
            echo "❌ Bundle exceeds ${MAX_SIZE}B limit. Run a bundle analysis to find the culprits."
            exit 1
          fi
          echo "✅ Bundle size is within limits."
